<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VR Tubo Venturi</title>

  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>

  <style>
    body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }

    #panel {
      position: fixed;
      bottom: 16px;
      left: 16px;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 14px 18px;
      border-radius: 10px;
      z-index: 999;
      width: 260px;
    }

    #panel label { font-size: 13px; display: block; margin-bottom: 4px; }
    #panel input[type=range] { width: 100%; }

    #panel .btns { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    #panel button {
      flex: 1;
      padding: 8px 6px;
      font-size: 12px;
      border: none;
      border-radius: 6px;
      background: #0d9488;
      color: white;
      cursor: pointer;
    }
    #panel button:active { background: #0f766e; }

    #instrucciones {
      position: fixed;
      top: 10px;
      left: 0;
      width: 100%;
      text-align: center;
      color: white;
      font-size: 13px;
      text-shadow: 0 1px 3px black;
      z-index: 999;
      padding: 0 10px;
    }
  </style>
</head>
<body>

  <div id="instrucciones">
    Muévete con las teclas W A S D · Mira alrededor arrastrando el mouse (o el dedo en celular)
  </div>

  <div id="panel">
    <label>Caudal (afecta velocidad y presión): <span id="caudalValor">50</span>%</label>
    <input type="range" id="caudalSlider" min="10" max="100" value="50">
    <div class="btns">
      <button onclick="irA('entrada')">Ir a entrada</button>
      <button onclick="irA('garganta')">Ir a garganta</button>
      <button onclick="irA('interior')">Ver desde interior</button>
    </div>
  </div>

  <a-scene>

    <a-sky color="#bcd6e0"></a-sky>
    <a-plane rotation="-90 0 0" width="30" height="30" color="#8a9a8a"></a-plane>

    <!-- Modelo estático del Tubo Venturi -->
    <a-entity
      id="modeloVenturi"
      gltf-model="tubo_venturi.glb"
      scale="1 1 1"
      position="0 1 -3"
      rotation="-90 0 0">
    </a-entity>

    <!-- Líneas de corriente: 3 filas de partículas que representan el flujo,
         su velocidad y opacidad cambian según el caudal del control -->
    <a-entity id="lineasCorriente" position="0 1 -3">
      <a-sphere class="particula fila1" radius="0.04" color="#3ea6ff" position="-1.2 0.15 0"></a-sphere>
      <a-sphere class="particula fila2" radius="0.04" color="#3ea6ff" position="-1.2 0 0"></a-sphere>
      <a-sphere class="particula fila3" radius="0.04" color="#3ea6ff" position="-1.2 -0.15 0"></a-sphere>
    </a-entity>

    <!-- Indicador de presión: una barra que sube en la entrada (alta presión)
         y baja en la garganta (baja presión), cambia con el caudal -->
    <a-box id="barraPresionEntrada" position="-1.3 1.9 -3" width="0.08" depth="0.08" height="0.4" color="#e63946"></a-box>
    <a-box id="barraPresionGarganta" position="0 1.9 -3" width="0.08" depth="0.08" height="0.15" color="#e63946"></a-box>

    <!-- Paneles informativos (al menos 3), con texto que se puede leer al acercarse -->
    <a-entity position="-1.6 1.6 -3" rotation="0 30 0">
      <a-plane width="1" height="0.5" color="#0d9488" opacity="0.9"></a-plane>
      <a-text value="Sección de Entrada
Diámetro grande.
Velocidad baja, presión alta."
        align="center" color="white" width="1.6" position="0 0 0.01"></a-text>
    </a-entity>

    <a-entity position="0 2.1 -3">
      <a-plane width="1" height="0.5" color="#0d9488" opacity="0.9"></a-plane>
      <a-text value="Garganta (Sección 2)
Principio de Bernoulli:
al reducirse el área, sube la
velocidad y baja la presión."
        align="center" color="white" width="1.6" position="0 0 0.01"></a-text>
    </a-entity>

    <a-entity position="1.6 1.6 -3" rotation="0 -30 0">
      <a-plane width="1" height="0.5" color="#0d9488" opacity="0.9"></a-plane>
      <a-text value="Sección de Salida
El área vuelve a aumentar.
La presión se recupera
parcialmente."
        align="center" color="white" width="1.6" position="0 0 0.01"></a-text>
    </a-entity>

    <!-- Luces -->
    <a-entity light="type: ambient; intensity: 0.6"></a-entity>
    <a-entity light="type: directional; intensity: 0.6" position="2 4 2"></a-entity>

    <!-- Cámara controlable: caminar con WASD, mirar con mouse/touch -->
    <a-entity id="rig" position="0 1.6 1" movement-controls wasd-controls="acceleration: 20" look-controls>
      <a-camera id="camara" look-controls wasd-controls></a-camera>
    </a-entity>

  </a-scene>

  <script>
    let caudal = 50;
    let animando = false;

    const slider = document.getElementById('caudalSlider');
    const valorSpan = document.getElementById('caudalValor');

    slider.addEventListener('input', function () {
      caudal = parseInt(slider.value);
      valorSpan.innerText = caudal;
      actualizarVisual();
    });

    function actualizarVisual() {
      // A mayor caudal: más rápido el flujo, más alta la presión de entrada,
      // más baja la presión en la garganta (Bernoulli)
      const duracion = Math.max(400, 2200 - caudal * 18); // más caudal = más rápido
      document.querySelectorAll('.particula').forEach(function (p) {
        p.setAttribute('animation__mov', {
          property: 'position',
          to: (parseFloat(p.getAttribute('position').x) > 0 ? '-1.2' : '1.2') + ' ' + p.getAttribute('position').y + ' 0',
          dur: duracion,
          loop: true,
          dir: 'alternate',
          easing: 'easeInOutSine'
        });
      });

      const alturaEntrada = 0.3 + (caudal / 100) * 0.3;
      const alturaGarganta = 0.4 - (caudal / 100) * 0.3;

      document.querySelector('#barraPresionEntrada').setAttribute('height', alturaEntrada);
      document.querySelector('#barraPresionGarganta').setAttribute('height', Math.max(0.05, alturaGarganta));
    }

    function irA(destino) {
      const rig = document.querySelector('#rig');
      if (destino === 'entrada') {
        rig.setAttribute('position', '-2 1.6 -1');
      } else if (destino === 'garganta') {
        rig.setAttribute('position', '0 1.3 -2.2');
      } else if (destino === 'interior') {
        rig.setAttribute('position', '0 1 -3');
      }
    }

    // Inicializa el movimiento de las partículas al cargar
    window.addEventListener('load', actualizarVisual);
  </script>

</body>
</html>
